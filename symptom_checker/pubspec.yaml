name: symptom_checker
description: AI-powered offline symptom checker for rural healthcare
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0
  provider: ^6.1.1
  flutter_svg: ^2.0.9
  tflite_flutter: ^0.10.4
  permission_handler: ^11.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/translations/
    - assets/models/